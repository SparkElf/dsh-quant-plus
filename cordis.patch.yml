# The @sparkelf/dsh-quant bundle patch: inserts the SparkElf-maintained quant
# toolkit into any profile that stacks this bundle (or installs it via
# `dsh plugin add @sparkelf/dsh-quant`).
#
# Fork of pengpengyi92/dsh-quant (MIT). Fork additions, all backward compatible:
#   - quant_factor_evaluate_cs: correct cross-sectional IC / ICIR / t-stat
#   - equityMetrics / riskMetrics / computeSharpe take an `annualization`
#     parameter (default 365 keeps upstream behavior; A-share callers pass 243)
#
# Row id and plugin name: a user can override config or disable the row from
# their own cordis.patch.yml by id. The row id keeps the historical
# 'quant-indicators' anchor for backward compatibility with existing patches.

- insert:
    - id: quant-indicators
      name: '@sparkelf/dsh-quant'
